
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Arena</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#101827;
 color:white;
}
header{
 padding:25px;
 text-align:center;
 background:#17243a;
}
header h1{color:#60a5fa;margin:0}
main{max-width:650px;margin:auto;padding:20px}
.card{
 background:#1e293b;
 padding:20px;
 border-radius:15px;
 margin:15px 0;
}
input{
 width:100%;padding:14px;border-radius:9px;
 border:0;margin:8px 0;font-size:16px;
}
button{
 background:#3b82f6;color:white;border:0;
 padding:13px 20px;border-radius:9px;
 font-weight:bold;cursor:pointer;
}
button:hover{background:#2563eb}
.candidate{
 background:#263449;padding:15px;
 border-radius:10px;margin:12px 0;
}
.bar{
 height:9px;background:#475569;
 border-radius:10px;margin-top:8px;
 overflow:hidden;
}
.fill{height:100%;background:#38bdf8}
.rank{color:#fbbf24;font-weight:bold}
footer{text-align:center;color:#94a3b8;padding:25px}
</style>
</head>
<body>
<header>
<h1>🏆 VOTE ARENA</h1>
<p>Vote pour tes favoris !</p>
</header>

<main>
<div class="card">
<h2>🗳️ Le grand vote</h2>
<p>Choisis ton candidat préféré :</p>
<div id="candidates"></div>
</div>

<div class="card">
<h2>🏆 Classement</h2>
<div id="ranking"></div>
</div>

<div class="card">
<h2>➕ Ajouter un candidat</h2>
<input id="newName" placeholder="Nom du candidat">
<button onclick="addCandidate()">Ajouter</button>
</div>
</main>

<footer>Vote Arena © 2026</footer>

<script>
let candidates = JSON.parse(localStorage.getItem("candidates")) || [
 {name:"Candidat 1",votes:0},
 {name:"Candidat 2",votes:0},
 {name:"Candidat 3",votes:0}
];

function save(){
 localStorage.setItem("candidates",JSON.stringify(candidates));
 render();
}

function vote(index){
 candidates[index].votes++;
 save();
}

function addCandidate(){
 let name=document.getElementById("newName").value.trim();
 if(!name)return alert("Entre un nom !");
 if(candidates.some(c=>c.name.toLowerCase()===name.toLowerCase()))
 return alert("Ce candidat existe déjà !");
 candidates.push({name:name,votes:0});
 document.getElementById("newName").value="";
 save();
}

function render(){
 let total=candidates.reduce((s,c)=>s+c.votes,0);
 document.getElementById("candidates").innerHTML=
 candidates.map((c,i)=>`
 <div class="candidate">
 <h3>${escapeHTML(c.name)}</h3>
 <p>${c.votes} vote(s)</p>
 <button onclick="vote(${i})">VOTER</button>
 </div>`).join("");

 let sorted=[...candidates].sort((a,b)=>b.votes-a.votes);
 document.getElementById("ranking").innerHTML=
 sorted.map((c,i)=>`
 <div class="candidate">
 <span class="rank">#${i+1}</span>
 <strong> ${escapeHTML(c.name)}</strong>
 <p>${c.votes} vote(s) · ${total?Math.round(c.votes/total*100):0}%</p>
 <div class="bar"><div class="fill" style="width:${total?c.votes/total*100:0}%"></div></div>
 </div>`).join("");
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
render();
</script>
</body>
</html>
