
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Academy - Votes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 14px;background:#080808;color:white;font-family:Arial,sans-serif;text-align:center}
h1{font-size:27px;margin:10px 0 8px}
h2{font-size:19px;color:#f5d34f;margin:28px 0 18px}
.intro{color:#aaa;margin-bottom:25px}
#status{color:#aaa;font-size:13px;margin:15px}
.grid{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.person{background:#171717;border:1px solid #333;border-radius:12px;padding:15px 10px}
.name{font-size:19px;font-weight:bold;margin-bottom:8px}
.state{font-size:11px;letter-spacing:1px;color:#bbb;margin-bottom:12px}
button{width:100%;border:0;border-radius:8px;padding:12px 8px;font-weight:bold;font-size:14px;color:#080808;background:#4b9cff}
button.yellow{background:#f5d34f}
button.red{background:#e34b4b;color:white}
button.black{background:#333;color:white}
button:disabled{opacity:.55;cursor:not-allowed}
.count{margin-top:10px;color:#ddd;font-size:14px}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>⭐ STAR ACADEMY ⭐</h1>
<div class="intro">Soutiens tes candidats préférés !</div>
<h2>CÔTE DE POPULARITÉ</h2>
<div id="status">Connexion aux votes...</div>
<div class="grid" id="candidates"></div>

<script>
const SUPABASE_URL = "https://qdibctjpzozlpngvjsvc.supabase.co";
const SUPABASE_KEY = "sb_publishable_X5SZIRRcg8wiInW1GQTvCw_eZKRPCmA";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const people = [
  {name:"Noémie", state:"IMMUNISÉE", style:"yellow", canVote:true},
  {name:"Maud", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Brieuc", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Leeloo", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Tracy", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Félix", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Morgan", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Cameron", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Amel", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Isabella", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Ydriss", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Melina", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Kylian", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Zoe", state:"EN COMPÉTITION", style:"", canVote:true},
  {name:"Antoine", state:"ÉLIMINÉ", style:"red", canVote:false},
  {name:"Elija", state:"ÉLIMINÉ", style:"red", canVote:false},
  {name:"Khalil", state:"ABANDON", style:"black", canVote:false}
];

const container = document.getElementById("candidates");

function displayPeople(counts) {
  container.innerHTML = "";
  people.forEach(person => {
    const card = document.createElement("div");
    card.className = "person";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = person.name;

    const state = document.createElement("div");
    state.className = "state";
    state.textContent = person.state;

    const button = document.createElement("button");
    button.className = person.style;
    button.textContent = person.canVote ? "VOTER" : "VOTE IMPOSSIBLE";
    button.disabled = !person.canVote;
    if (person.canVote) {
      button.addEventListener("click", () => castVote(person.name, button));
    }

    const count = document.createElement("div");
    count.className = "count";
    count.id = "count-" + person.name;
    count.textContent = (counts[person.name] || 0) + " vote(s)";

    card.append(name, state, button, count);
    container.appendChild(card);
  });
}

async function refreshVotes() {
  const { data, error } = await db.from("votes").select("candidate");

  if (error) {
    document.getElementById("status").textContent =
      "Erreur de chargement des votes. Vérifie les réglages Supabase.";
    console.error(error);
    return;
  }

  const counts = {};
  data.forEach(row => {
    counts[row.candidate] = (counts[row.candidate] || 0) + 1;
  });

  displayPeople(counts);
  document.getElementById("status").textContent = "Votes partagés en ligne ✓";
}

async function castVote(candidate, button) {
  button.disabled = true;
  button.textContent = "ENVOI...";

  const { error } = await db.from("votes").insert({candidate: candidate});

  if (error) {
    alert("Le vote n'a pas été enregistré. Réessaie !");
    console.error(error);
  }

  await refreshVotes();
}

refreshVotes();
setInterval(refreshVotes, 5000);
</script>
</body>
</html>
