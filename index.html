
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Academy - Côte de popularité</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

h1, h2 {
  text-align: center;
}

h1 {
  margin-bottom: 30px;
}

h2 {
  font-size: 22px;
  margin-bottom: 25px;
}

.candidat {
  max-width: 500px;
  margin: 14px auto;
  padding: 16px;
  background: #191919;
  border-radius: 12px;
}

.nom {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.statut {
  display: inline-block;
  font-size: 12px;
  font-weight: bold;
  padding: 6px 10px;
  border-radius: 20px;
  margin-bottom: 12px;
}

.jaune {
  background: #ffd900;
  color: black;
}

.bleu {
  background: #38bdf8;
  color: #001522;
}

.rouge {
  background: #e53935;
  color: white;
}

.noir {
  background: #000;
  color: white;
  border: 1px solid #777;
}

button {
  display: block;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 12px;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.barre {
  height: 12px;
  background: #444;
  border-radius: 20px;
  overflow: hidden;
}

.progression {
  height: 100%;
  width: 0%;
  background: #38bdf8;
  transition: width 0.3s;
}

.compteur {
  text-align: right;
  font-size: 12px;
  color: #ccc;
  margin-top: 5px;
}

#message {
  text-align: center;
  color: #ffd900;
  margin: 20px auto;
}
</style>
</head>

<body>

<h1>⭐ STAR ACADEMY ⭐</h1>
<h2>CÔTE DE POPULARITÉ</h2>

<div id="liste"></div>
<p id="message"></p>

<script>
const candidats = [
  { nom: "Noémie", statut: "IMMUNISÉE", couleur: "jaune", votable: true },
  { nom: "Maud", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Brieuc", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Leeloo", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Tracy", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Félix", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Morgan", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Cameron", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Amel", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Isabella", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Ydriss", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Melina", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Kylian", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Zoe", statut: "EN COMPÉTITION", couleur: "bleu", votable: true },
  { nom: "Antoine", statut: "ÉLIMINÉ", couleur: "rouge", votable: false },
  { nom: "Elija", statut: "ÉLIMINÉ", couleur: "rouge", votable: false },
  { nom: "Khalil", statut: "ABANDON", couleur: "noir", votable: false }
];

const votes = candidats.map(() => 0);
const liste = document.getElementById("liste");

candidats.forEach((candidat, index) => {
  const carte = document.createElement("div");
  carte.className = "candidat";

  const nom = document.createElement("div");
  nom.className = "nom";
  nom.textContent = candidat.nom;

  const statut = document.createElement("span");
  statut.className = "statut " + candidat.couleur;
  statut.textContent = candidat.statut;

  const bouton = document.createElement("button");
  bouton.className = candidat.couleur;
  bouton.textContent = candidat.votable
    ? "VOTER POUR " + candidat.nom.toUpperCase()
    : "VOTE IMPOSSIBLE";
  bouton.disabled = !candidat.votable;

  const barre = document.createElement("div");
  barre.className = "barre";

  const progression = document.createElement("div");
  progression.className = "progression";
  progression.id = "barre-" + index;

  barre.appendChild(progression);

  const compteur = document.createElement("div");
  compteur.className = "compteur";
  compteur.id = "compteur-" + index;
  compteur.textContent = "0 vote";

  carte.appendChild(nom);
  carte.appendChild(statut);
  carte.appendChild(bouton);
  carte.appendChild(barre);
  carte.appendChild(compteur);

  liste.appendChild(carte);

  if (candidat.votable) {
    bouton.addEventListener("click", function() {
      votes[index]++;
      actualiser();

      document.getElementById("message").textContent =
        "Merci pour ton vote ! ❤️";
    });
  }
});

function actualiser() {
  const total = votes.reduce((a, b) => a + b, 0);

  candidats.forEach((candidat, index) => {
    const pourcentage = total === 0
      ? 0
      : (votes[index] / total) * 100;

    document.getElementById("barre-" + index).style.width =
      pourcentage + "%";

    document.getElementById("compteur-" + index).textContent =
      votes[index] + (votes[index] > 1 ? " votes" : " vote");
  });
}
</script>

</body>
</html>
